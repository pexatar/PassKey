name: CI

on:
  push:
    # refactor/2.0/ui-rifondazione is listed so the cloud session (Linux, cannot build
    # WinUI) gets a real Windows compile + test run on every push, without opening a PR.
    # TEMPORARY: remove this branch from the list before the branch is ever merged.
    branches: [main, develop, refactor/2.0/ui-rifondazione]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore PassKey.sln

      - name: Build Core
        run: dotnet build src/PassKey.Core/PassKey.Core.csproj -c Release

      - name: Build BrowserHost
        run: dotnet build src/PassKey.BrowserHost/PassKey.BrowserHost.csproj -c Release -r win-x64

      - name: Test
        run: dotnet test src/PassKey.Tests/PassKey.Tests.csproj --verbosity normal

      # if: always() so the Desktop compile still runs when an earlier step fails.
      # The cloud session needs the XAML/compiler result on every push, and a flaky
      # timing test (PerformanceTests.UrlMatching_500Entries_Under50ms, 50ms threshold
      # on a shared runner) would otherwise hide it. The job still reports failure.
      # TEMPORARY: remove together with the branch entry in the push trigger.
      - name: Build Desktop
        if: always()
        run: dotnet build src/PassKey.Desktop/PassKey.Desktop.csproj -p:Platform=x64 -c Release

  # TEMPORARY — companion to the push-trigger note above. Produces a build of the
  # refactoring branch so the pilot section can actually be tested: the cloud session runs
  # on Linux and cannot build WinUI, and tagging a release before the user's testing gate is
  # forbidden, so the packages are attached to the CI run instead of published.
  #
  # The Download-Runtime step is the missing piece release.yml also needs (T8.1): the Windows
  # App Runtime installer is gitignored, so without it Inno Setup has nothing to bundle.
  #
  # Remove together with the branch entry in the push trigger and the if: always() above.
  build-artifacts:
    if: github.ref == 'refs/heads/refactor/2.0/ui-rifondazione'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Download Windows App Runtime
        run: .\Installer\Download-Runtime.ps1
        shell: pwsh

      - name: Build installer and portable ZIP
        run: .\scripts\build-installer.ps1
        shell: pwsh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: PassKey-rifondazione-note-sicure
          path: |
            Installer/Output/PassKey-Portable-x64.zip
            Installer/Output/PassKey-Setup-x64.exe
          if-no-files-found: error
